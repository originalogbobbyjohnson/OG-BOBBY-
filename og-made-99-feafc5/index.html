<style>
/* Street-corner cover first (art fills the screen, playlist name only); tap to open the songs.
   Every text block sits on its own dark surface so nothing ever lands on white. */
:root {
  --bg: #0a0d0b; --panel: rgba(14,20,16,.92); --row: rgba(255,255,255,.04); --line: rgba(255,255,255,.10);
  --fg: #ffffff; --soft: #e9ece8; --gold: #e3b23c;
  --display: "Anton", Impact, "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  color-scheme: dark only;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #0a0d0b !important; color: var(--fg); }
body { font-family: var(--body); font-size: 16px; -webkit-tap-highlight-color: transparent; min-height: 100dvh; }
.nine { font-family: "Sedgwick Nine", "Sedgwick Ave Display", cursive; }

/* Cover */
#cover { position: fixed; inset: 0; z-index: 5; background: #000; cursor: pointer; display: grid; transition: opacity .45s ease, transform .45s ease; }
#cover.gone { opacity: 0; transform: scale(1.04); pointer-events: none; }
#cover img.art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
#cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.25) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 50%, rgba(0,0,0,.85) 80%, #000 100%); }
.cover-txt { position: relative; z-index: 1; align-self: end; justify-self: center; text-align: center; padding: 0 16px max(36px, env(safe-area-inset-bottom)); width: min(100%, 520px); }
.cover-txt .wm { display: block; width: min(70%, 260px); height: auto; margin: 0 auto; filter: drop-shadow(3px 3px 0 #000); }
.cover-txt .name { display: block; margin-top: 10px; font-family: "Sedgwick Nine", "Sedgwick Ave Display", cursive; font-size: clamp(2.4rem, 11vw, 3.4rem); line-height: 1; color: #fff; text-shadow: 3px 3px 0 #000; }
.cover-txt .open { display: inline-flex; align-items: center; gap: 10px; margin-top: 22px; padding: 12px 26px; border-radius: 999px; background: rgba(0,0,0,.6); border: 2px solid var(--gold); color: #fff; font: 600 1rem var(--body); letter-spacing: .14em; text-transform: uppercase; }
.cover-txt .open svg { width: 18px; height: 18px; fill: var(--gold); }

/* Songs view */
#bgArt { position: fixed; inset: 0; z-index: 0; background: #0a0d0b url("art.jpg") 50% 30% / cover no-repeat; filter: blur(18px) brightness(.35); transform: scale(1.1); }
.wrap { position: relative; z-index: 1; max-width: 540px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 48px; display: grid; gap: 16px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top .back { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: rgba(0,0,0,.5); display: grid; place-items: center; cursor: pointer; }
.top .back svg { width: 22px; height: 22px; fill: #fff; }
.top .mid { flex: 1; min-width: 0; text-align: center; }
.top .mid img { display: block; width: min(100%, 180px); height: auto; margin: 0 auto; filter: drop-shadow(2px 2px 0 #000); }
.top .mid .name { display: block; margin-top: 4px; font-family: "Sedgwick Nine", "Sedgwick Ave Display", cursive; font-size: 1.6rem; line-height: 1; color: #fff; text-shadow: 2px 2px 0 #000; }
.nine-badge { flex: none; display: flex; align-items: flex-start; justify-content: center; padding-top: 10px; gap: 1px; width: 52px; height: 52px; border-radius: 12px; background: #000; border: 2px solid #e3b23c; box-shadow: 0 0 14px 3px rgba(227,178,60,.55); }
.nine-badge svg { width: 17px; height: auto; overflow: visible; }
.nine-badge .tick { font-family: var(--display); font-size: 1.3rem; line-height: .8; color: #fff; text-shadow: 2px 2px 0 #000; }
.now { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.lab { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); }
#nowTitle { font-family: var(--display); font-weight: 400; font-size: 1.8rem; line-height: 1.05; color: #fff; }
input[type=range] { width: 100%; accent-color: var(--gold); }
.times { display: flex; justify-content: space-between; color: var(--soft); font-size: .8rem; font-variant-numeric: tabular-nums; }
.controls { display: flex; justify-content: center; align-items: center; gap: 20px; }
.controls button { background: rgba(0,0,0,.35); border: 1px solid var(--line); color: #fff; border-radius: 50%; width: 56px; height: 56px; display: grid; place-items: center; cursor: pointer; }
.controls button.play { width: 72px; height: 72px; background: var(--gold); border-color: var(--gold); color: #000; }
.controls svg { width: 24px; height: 24px; fill: currentColor; }
.controls button.play svg { width: 30px; height: 30px; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.songs { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 6px; }
.songs .sub { color: var(--soft); font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; padding: 12px 12px 8px; }
ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
li button { width: 100%; display: grid; grid-template-columns: 2.2rem 1fr auto; gap: 10px; align-items: center; text-align: left; background: var(--row); border: 0; border-left: 3px solid transparent; border-radius: 12px; color: #fff; font: 600 1.05rem var(--body); padding: 14px 12px; cursor: pointer; }
li .n { color: var(--soft); font-variant-numeric: tabular-nums; font-size: .9rem; text-align: center; }
li .t { min-width: 0; overflow-wrap: anywhere; color: #fff; }
li .d { color: var(--soft); font-size: .85rem; font-weight: 400; font-variant-numeric: tabular-nums; }
li button[aria-current="true"] { background: rgba(227,178,60,.14); border-left-color: var(--gold); }
li button[aria-current="true"] .t, li button[aria-current="true"] .n { color: var(--gold); }

.cover-txt .name.big { font-size: clamp(3.4rem, 17vw, 5rem); margin-top: 6px; }
.cover-txt .n99 { display: flex; justify-content: center; align-items: flex-start; margin-top: 2px; font-size: clamp(2.2rem, 10vw, 3rem); line-height: 1; color: #d62828; text-shadow: 3px 3px 0 #000; }
.cover-txt .n99 .tk { font-family: var(--display); font-size: .8em; line-height: .9; color: #d62828; }
.cover-txt .rel { display: block; margin-top: 6px; color: #fff; font: 600 .8rem var(--body); letter-spacing: .2em; text-transform: uppercase; text-shadow: 2px 2px 0 #000; }
.top .mid .name { font-size: 1.5rem; }
li.sea { padding: 14px 12px 6px; color: #fff; font: 600 .82rem var(--body); letter-spacing: .18em; text-transform: uppercase; }
li.sea .nine { font-size: 1.15rem; letter-spacing: 0; }
li.sea .tk { font-family: var(--display); letter-spacing: 0; }
.songs { padding-top: 0; }

.cover-txt .sea { display: block; margin-top: 8px; color: #fff; font: 600 1rem var(--body); letter-spacing: .24em; text-transform: uppercase; text-shadow: 2px 2px 0 #000; }
.top .mid .sea { display: block; margin-top: 2px; color: #fff; font: 600 .72rem var(--body); letter-spacing: .22em; text-transform: uppercase; }
footer { color: var(--soft); font-size: .8rem; text-align: center; }
</style>

<script>
const CFG = {"mode": "tracks", "mix": "", "tracks": [{"t": "Whatever It Takes", "f": "36205c960b63.mp3", "d": 157.52, "s": 0.0, "n": 1, "se": 1}, {"t": "Ridge Brothers", "f": "59371541676c.mp3", "d": 206.39, "s": 0.0, "n": 2, "se": 1}, {"t": "Bay Ridge Nights", "f": "0cffe671ed63.mp3", "d": 187.17, "s": 0.0, "n": 3, "se": 1}, {"t": "The Get Back (Raw Cut)", "f": "628661269f01.mp3", "d": 202.42, "s": 0.0, "n": 4, "se": 1}, {"t": "Pioneer", "f": "2fcf00af916f.mp3", "d": 202.27, "s": 0.0, "n": 5, "se": 1}, {"t": "Bars & Clubs", "f": "e3f3994d13d2.mp3", "d": 160.99, "s": 0.0, "n": 6, "se": 1}, {"t": "Bay Ridge Is Mine", "f": "07e0acbb50a5.mp3", "d": 270.16, "s": 0.0, "n": 7, "se": 1}, {"t": "Black Rob", "f": "2ddaa23c04ec.mp3", "d": 214.18, "s": 0.0, "n": 8, "se": 1}, {"t": "Positivity Spreads", "f": "04ad61a7d37e.mp3", "d": 222.8, "s": 0.0, "n": 9, "se": 1}, {"t": "After Hours", "f": "f999844d0224.mp3", "d": 277.37, "s": 0.0, "n": 1, "se": 2}, {"t": "Bridgeview to Vegas", "f": "b54a71f1b2ed.mp3", "d": 244.82, "s": 0.0, "n": 2, "se": 2}, {"t": "Wall Street Machine, Pt. 1", "f": "78a96d218928.mp3", "d": 186.02, "s": 0.0, "n": 3, "se": 2}, {"t": "Ridge Reels", "f": "daec866bb022.mp3", "d": 114.43, "s": 0.0, "n": 4, "se": 2}, {"t": "Mikey the Rat", "f": "cc5d301f8062.mp3", "d": 245.94, "s": 0.0, "n": 5, "se": 2}, {"t": "The Ridge to The Beach", "f": "7da0390d9b18.mp3", "d": 121.75, "s": 0.0, "n": 6, "se": 2}, {"t": "Fort Hamilton Parkway", "f": "3e21ffaaa1e1.mp3", "d": 262.44, "s": 0.0, "n": 7, "se": 2}, {"t": "Wall Street Machine, Pt. 2", "f": "256b761215fd.mp3", "d": 172.22, "s": 0.0, "n": 8, "se": 2}, {"t": "Everybody's Bay Ridge", "f": "625ec773210c.mp3", "d": 216.02, "s": 0.0, "n": 9, "se": 2}]};
const T = CFG.tracks, FADE = CFG.mode === "fade";
const audio = document.getElementById("audio");
const $ = id => document.getElementById(id);
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
let cur = 0, seeking = false;

T.forEach((t, i) => {
  if (!i || T[i-1].se !== t.se) { const h = document.createElement("li"); h.className = "sea"; h.innerHTML = t.se === 1 ? 'Season 1 · <span class="tk">’</span><span class="nine">9</span>' : 'Season 2 · <span class="nine">9</span>'; $("list").appendChild(h); }
  const li = document.createElement("li"), b = document.createElement("button");
  b.innerHTML = '<span class="n">' + (t.n || i + 1) + '</span><span class="t"></span><span class="d">' + fmt(t.d) + '</span>';
  b.querySelector(".t").textContent = t.t;
  b.onclick = () => go(i, true);
  li.appendChild(b); $("list").appendChild(li);
});
const btns = [...document.querySelectorAll("li button")];
T.forEach((t, i) => btns[i].querySelector(".t").insertAdjacentHTML("beforeend", ""));

function mark(i) {
  if (i === cur && btns[i].getAttribute("aria-current")) return;
  cur = i;
  btns.forEach(b => b.removeAttribute("aria-current"));
  btns[i].setAttribute("aria-current", "true");
  $("nowTitle").textContent = T[i].t;
  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: T[i].t, artist: "OG Bobby", album: "OG Made ’99",
        artwork: [{ src: new URL("art-sq.png", location.href).href, sizes: "512x512", type: "image/png" }] });
    } catch (e) {}
  }
}

function go(i, play) {
  if (i < 0 || i >= T.length) return;
  if (FADE) {
    if (!audio.src) audio.src = "../m/" + CFG.mix;
    const seekTo = () => { audio.currentTime = T[i].s; };
    if (audio.readyState >= 1) seekTo(); else audio.addEventListener("loadedmetadata", seekTo, { once: true });
  } else {
    audio.src = "../m/" + T[i].f;
  }
  mark(i);
  if (play) audio.play().catch(() => {});
}

function idxAt(t) { let i = 0; for (let k = 0; k < T.length; k++) if (t >= T[k].s) i = k; return i; }

audio.addEventListener("timeupdate", () => {
  if (FADE) {
    const i = idxAt(audio.currentTime + 0.5);
    if (i !== cur) mark(i);
    if (!seeking) {
      const d = audio.duration || 1;
      $("seek").value = audio.currentTime / d * 1000;
      $("cur").textContent = fmt(audio.currentTime); $("tot").textContent = fmt(audio.duration);
    }
  } else if (!seeking) {
    const d = audio.duration || T[cur].d;
    $("seek").value = audio.currentTime / d * 1000;
    $("cur").textContent = fmt(audio.currentTime); $("tot").textContent = fmt(d);
  }
});
audio.addEventListener("ended", () => { if (!FADE && cur + 1 < T.length) go(cur + 1, true); setIcon(); });
const setIcon = () => {
  $("playIcon").innerHTML = audio.paused ? '<path d="M8 5v14l11-7z"/>' : '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  $("play").setAttribute("aria-label", audio.paused ? "Play" : "Pause");
};
audio.addEventListener("play", setIcon); audio.addEventListener("pause", setIcon);

$("play").onclick = () => { if (!audio.src) go(0, true); else audio.paused ? audio.play() : audio.pause(); };
$("next").onclick = () => go(Math.min(cur + 1, T.length - 1), true);
$("prev").onclick = () => {
  const into = FADE ? audio.currentTime - T[cur].s : audio.currentTime;
  go(into > 3 || cur === 0 ? cur : cur - 1, true);
};
$("seek").addEventListener("input", () => { seeking = true; const d = audio.duration || 0; $("cur").textContent = fmt($("seek").value / 1000 * d); });
$("seek").addEventListener("change", () => { const d = audio.duration || 0; audio.currentTime = $("seek").value / 1000 * d; seeking = false; });

if ("mediaSession" in navigator) {
  try {
    navigator.mediaSession.setActionHandler("nexttrack", () => $("next").onclick());
    navigator.mediaSession.setActionHandler("previoustrack", () => $("prev").onclick());
    navigator.mediaSession.setActionHandler("play", () => audio.play());
    navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  } catch (e) {}
}
const coverEl = document.getElementById("cover");
const openIt = () => { coverEl.classList.add("gone"); window.scrollTo(0, 0); };
coverEl.addEventListener("click", openIt);
coverEl.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openIt(); } });
document.getElementById("toCover").onclick = () => coverEl.classList.remove("gone");
mark(0);
$("tot").textContent = fmt(T[0].d);
</script>
