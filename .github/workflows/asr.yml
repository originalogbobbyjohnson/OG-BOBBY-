name: asr
on:
  push:
    branches: [asr-tmp]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q faster-whisper
      - run: python3 asr/run.py
      - run: |
          git config user.name "OG Bobby"; git config user.email originalogbobbyjohnson@gmail.com
          git add -f asr/words.txt && git commit -m "asr result" && git push
