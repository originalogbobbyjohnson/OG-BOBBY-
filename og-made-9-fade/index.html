<style>
/* Layout: one narrow column — cover + now playing on top, controls, then the tracklist. Single dark look by choice. */
:root {
  --bg: #0f1a12; --panel: #17251a; --line: #24382a;
  --fg: #eef3ea; --muted: #9db3a2; --accent: #e3b23c;
  --display: "Anton", Impact, "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 16px; }
.wrap { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 40px; display: grid; gap: 20px; }
header { display: grid; gap: 14px; }
header img { width: 100%; max-width: 100%; aspect-ratio: 1376 / 768; object-fit: cover; border-radius: 12px; display: block; }
header .meta { min-width: 0; }
h1 { font-family: var(--display); font-weight: 400; font-size: 2.6rem; line-height: 1; margin: 0; letter-spacing: .02em; }
.sub { color: var(--muted); font-size: .9rem; margin-top: 6px; }
.now { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.now-art { width: 100%; max-width: 100%; aspect-ratio: 1376 / 768; object-fit: cover; border-radius: 10px; display: block; }
.now-label { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
#nowTitle { font-family: var(--display); font-weight: 400; font-size: 1.6rem; line-height: 1.1; text-wrap: balance; }
.seek { display: grid; gap: 4px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.times { display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.controls { display: flex; justify-content: center; align-items: center; gap: 6px; }
.controls button:not(.play) { width: 48px; height: 48px; box-sizing: border-box; flex: none; }
.controls button.skip { font: 600 .78rem var(--body); }
.controls button { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 50%; width: 56px; height: 56px; display: grid; place-items: center; cursor: pointer; }
.controls button.play { width: 72px; height: 72px; background: var(--accent); border-color: var(--accent); color: var(--bg); }
.controls svg { width: 24px; height: 24px; fill: currentColor; }
.controls button.play svg { width: 30px; height: 30px; }
button:focus-visible, li button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
ol { list-style: none; margin: 0; padding: 0; display: grid; }
li button { width: 100%; display: grid; grid-template-columns: 2rem 1fr auto; gap: 10px; align-items: center; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--fg); font: inherit; padding: 13px 4px; cursor: pointer; }
li .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .85rem; }
li .t { min-width: 0; overflow-wrap: anywhere; }
li .d { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
li.on button { color: var(--accent); font-weight: 600; }
li.on .n { color: var(--accent); }
.section { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 14px 4px 6px; }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <img src="../cover.jpg" alt="OG Bobby on a Bay Ridge street at night, Verrazzano Bridge and full moon behind him">
    <div class="meta">
      <h1>OG Made - 9 Fade</h1>
      <div class="sub"><span id="count"></span> tracks · <span id="total"></span></div>
    </div>
  </header>

  <section class="now" aria-label="Now playing">
    <div class="now-label">Now playing · <span id="nowNum">1</span> of <span id="ofN"></span></div>
    <div id="nowTitle">Whatever It Takes</div>
    <div class="seek">
      <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Seek">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="controls">
      <button id="prev" aria-label="Previous song"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
      <button id="back15" class="skip" aria-label="Back 15 seconds">−15</button>
      <button id="play" class="play" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="fwd15" class="skip" aria-label="Forward 15 seconds">+15</button>
      <button id="next" aria-label="Next song"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
  </section>

  <ol id="list"></ol>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
// One continuous mix: songs blend into each other with smooth crossfades. Each song is a starting point inside the mix.
const MIX = "../songs/25-og-made-9-fade-clean.mp3?v=3", LEN = 1897.5;
const TRACKS = [
  { t: "Whatever It Takes", s: 0.0 },
  { t: "Bay Ridge Nights", s: 161.05 },
  { t: "The Get Back", s: 359.44 },
  { t: "Pioneer", s: 539.06 },
  { t: "Ridge Brothers", s: 739.49 },
  { t: "Bars & Clubs", s: 956.89 },
  { t: "Bay Ridge Is Mine", s: 1129.07 },
  { t: "Positivity Spreads", s: 1402.83 },
  { t: "Black Rob", s: 1682.16 }
];
const $ = id => document.getElementById(id);
const audio = $("audio"), list = $("list");
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const end = k => (k + 1 < TRACKS.length ? TRACKS[k + 1].s : LEN);
let i = -1;
audio.preload = "auto";
audio.src = MIX;

$("count").textContent = TRACKS.length;
$("ofN").textContent = TRACKS.length;
$("total").textContent = "one " + Math.round(LEN / 60) + " min mix";

TRACKS.forEach((tr, k) => {
  const li = document.createElement("li");
  li.dataset.k = k;
  li.innerHTML = `<button><span class="n">${k + 1}</span><span class="t"></span><span class="d">${fmt(tr.s)}</span></button>`;
  li.querySelector(".t").textContent = tr.t;
  li.querySelector("button").onclick = () => go(k, true);
  list.appendChild(li);
});

function show(k) {
  if (k === i) return;
  i = k;
  const tr = TRACKS[i];
  $("nowTitle").textContent = tr.t;
  $("nowNum").textContent = i + 1;
  document.querySelectorAll("li[data-k]").forEach(li => li.classList.toggle("on", +li.dataset.k === i));
  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: tr.t, artist: "OG Bobby", album: "OG Made - 9 Fade",
        artwork: [{ src: new URL("../cover.jpg", location.href).href, sizes: "1376x768", type: "image/jpeg" }] });
    } catch (e) {}
  }
  if (!audio.paused) document.title = tr.t + " · OG Bobby";
}
function at(t) { let k = 0; TRACKS.forEach((tr, n) => { if (t >= tr.s) k = n; }); return k; }
function go(k, play) {
  k = Math.max(0, Math.min(TRACKS.length - 1, k));
  audio.currentTime = TRACKS[k].s;
  show(k);
  if (play) audio.play().catch(() => {});
}
function setIcon(playing) {
  $("playIcon").innerHTML = playing ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $("play").setAttribute("aria-label", playing ? "Pause" : "Play");
}
const next = () => (i + 1 < TRACKS.length ? go(i + 1, true) : go(0, true));
const prev = () => (audio.currentTime - TRACKS[i].s > 3 ? go(i, true) : go(i - 1, true));
const jump = sec => { audio.currentTime = Math.min(Math.max(0, audio.currentTime + sec), LEN - 0.5); };
$("play").onclick = () => audio.paused ? audio.play().catch(() => {}) : audio.pause();
$("next").onclick = next;
$("prev").onclick = prev;
$("back15").onclick = () => jump(-15);
$("fwd15").onclick = () => jump(15);
audio.onplay = () => { setIcon(true); document.title = TRACKS[i].t + " · OG Bobby"; try { navigator.mediaSession.playbackState = "playing"; } catch (e) {} };
audio.onpause = () => { setIcon(false); try { navigator.mediaSession.playbackState = "paused"; } catch (e) {} };
audio.onended = () => { go(0, false); setIcon(false); };
audio.ontimeupdate = () => {
  const t = audio.currentTime;
  show(at(t));
  // the bar and times follow the current song, not the whole mix
  const s0 = TRACKS[i].s, len = end(i) - s0;
  $("cur").textContent = fmt(t - s0);
  $("dur").textContent = fmt(len);
  $("seek").value = Math.min(100, ((t - s0) / len) * 100);
};
$("seek").oninput = e => { const s0 = TRACKS[i].s; audio.currentTime = s0 + (e.target.value / 100) * (end(i) - s0); };
if ("mediaSession" in navigator) {
  try {
    navigator.mediaSession.setActionHandler("nexttrack", next);
    navigator.mediaSession.setActionHandler("previoustrack", prev);
    navigator.mediaSession.setActionHandler("play", () => audio.play());
    navigator.mediaSession.setActionHandler("pause", () => audio.pause());
    navigator.mediaSession.setActionHandler("seekbackward", d => jump(-((d && d.seekOffset) || 15)));
    navigator.mediaSession.setActionHandler("seekforward", d => jump((d && d.seekOffset) || 15));
    navigator.mediaSession.setActionHandler("seekto", d => { if (d && d.seekTime != null) audio.currentTime = d.seekTime; });
  } catch (e) {}
}
show(0);
$("dur").textContent = fmt(end(0));
</script>

</body></html>
