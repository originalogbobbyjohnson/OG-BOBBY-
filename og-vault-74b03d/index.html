<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OG Vault · OG Bobby</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../cover.png">
<link rel="apple-touch-icon" href="../cover.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700&display=swap">
<style>
:root { --bg:#0f1a12; --panel:#17251a; --line:#2a4231; --gold:#e3b23c; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: #fff; font-family: "Barlow", system-ui, sans-serif; }
main { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 16px; }
.top { display: flex; align-items: center; gap: 12px; }
.wm { width: 150px; height: auto; filter: drop-shadow(2px 2px 0 #000); }
h1 { margin: 0; font-family: "Anton", Impact, sans-serif; font-weight: 400; font-size: 1.7rem; letter-spacing: .06em; color: var(--gold); }
.song { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; }
.song h2 { margin: 0; font-family: "Anton", Impact, sans-serif; font-weight: 400; font-size: 1.15rem; letter-spacing: .04em; }
.song p { margin: 0; font-size: .85rem; color: #fff; }
audio { width: 100%; }
</style>
</head>
<body>
<main>
  <div class="top"><img class="wm" src="../brand/og-bobby-wordmark.png" alt="OG Bobby" width="932" height="220"><h1>OG VAULT</h1></div>
  <!-- VAULT: newest first -->
  <section class="song">
    <h2>WHATEVER IT TAKES · V1</h2>
    <p>Original version · retired Oct 16, 2026</p>
    <audio controls preload="none" src="whatever-it-takes-v1.mp3"></audio>
  </section>
</main>
</body>
</html>
