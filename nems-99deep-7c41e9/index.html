<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>NEMS · 99 DEEP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700&display=swap">
<style>
/* Layout: one dark game cabinet, one narrow column, every screen framed with no scrolling on the card. */
:root {
  --bg: #0d0e11; --panel: #17181d; --panel2: #202228; --line: #2e3038;
  --fg: #ffffff; --soft: #e9e6df; --red: #d62828; --red-dim: #5a1717;
  --green: #35b867; --gold: #e0a52c;
  --display: "Anton", Impact, "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; padding-block: 14px 24px; display: grid; gap: 14px; }

/* Logo: 99 drawn as two straight-stem nines, then DEEP */
.logo { display: flex; align-items: center; gap: 8px; justify-content: center; }
.logo svg.nine { width: 30px; height: 42px; }
.logo .deep { font-family: var(--display); font-size: 2.6rem; letter-spacing: .06em; line-height: 1; text-shadow: 3px 3px 0 #000; }
.artist { font-family: var(--display); text-align: center; font-size: clamp(1.9rem, 9vw, 2.8rem); letter-spacing: .04em; line-height: 1.05; text-wrap: balance; margin: 0; }
.artist small { display: block; font-family: var(--body); font-weight: 700; font-size: .78rem; letter-spacing: .22em; color: var(--red); margin-bottom: 4px; }

/* Full-screen rooms (welcome + how to play) */
.room { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; place-items: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.room-in { width: min(100%, 420px); display: grid; gap: 22px; text-align: center; }
.room h2 { font-family: var(--display); font-size: 2.2rem; letter-spacing: .04em; line-height: 1.1; margin: 0; text-wrap: balance; }
.room p { margin: 0; font-size: 1.1rem; color: var(--soft); }
.room .icon { font-family: var(--display); font-size: 4.5rem; line-height: 1; color: var(--red); animation: bob 2.4s ease-in-out infinite; }
.dots { display: flex; gap: 8px; justify-content: center; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--red); }
.big-btn { background: var(--red); border: 0; border-radius: 12px; padding: 16px 20px; font-family: var(--display); font-size: 1.3rem; letter-spacing: .08em; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

/* Cabinet */
.cab { background: var(--panel); border: 2px solid var(--red-dim); border-radius: 18px; padding: 16px; display: grid; gap: 16px; }
.meter { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.row { display: grid; gap: 6px; }
.row .boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.lv { aspect-ratio: 1; border-radius: 6px; border: 2px solid var(--red); display: grid; place-items: center; font-family: var(--display); font-size: 1.05rem; }
.lv.done { background: var(--green); border-color: var(--green); }
.lv.now { box-shadow: 0 0 0 3px rgba(214,40,40,.4); animation: pulse 1.6s ease-in-out infinite; }
.rank { text-align: center; font-weight: 700; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; border: 1.5px solid var(--red); border-radius: 999px; padding: 3px 4px; }
.rank.got { border-color: var(--green); }
.top-rank { text-align: center; font-family: var(--display); letter-spacing: .1em; font-size: 1.15rem; color: var(--fg); }
.top-rank.got { color: var(--gold); text-shadow: 0 0 14px rgba(224,165,44,.6); }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(214,40,40,.15); } }

.stats { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-variant-numeric: tabular-nums; }
.stats b { font-family: var(--display); font-weight: 400; font-size: 1.4rem; letter-spacing: .03em; }
.stats .juice b { color: var(--green); }

/* Record = play button */
.deck { display: grid; place-items: center; gap: 8px; }
.record { width: 168px; height: 168px; border-radius: 50%; border: 0; padding: 0;
  background: repeating-radial-gradient(circle, #111 0 2px, #1c1c1f 2px 4px); box-shadow: 0 0 0 3px #000, 0 8px 24px rgba(0,0,0,.6);
  display: grid; place-items: center; position: relative; }
.record .label { width: 64px; height: 64px; border-radius: 50%; background: var(--red); display: grid; place-items: center; }
.record .label svg { width: 26px; height: 26px; fill: var(--fg); }
.record.spin { animation: spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.now-playing { font-weight: 700; text-align: center; min-height: 1.4em; }
a.yt { color: var(--fg); text-decoration: underline; text-decoration-color: var(--red); text-underline-offset: 4px; }

/* Question card */
.qcard { background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.qhead { display: flex; justify-content: space-between; font-weight: 700; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: var(--red); font-variant-numeric: tabular-nums; }
.qtext { font-size: 1.15rem; font-weight: 600; min-height: 3em; }
.empty { border: 2px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center; color: var(--soft); }
.opts { display: grid; gap: 8px; }
.opt { background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 12px; text-align: left; font-weight: 600; }
.opt.right { border-color: var(--green); }
.opt.wrong { border-color: var(--red); }
.next { background: transparent; border: 2px solid var(--red); border-radius: 10px; padding: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }

/* Songs */
.songs { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.song { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; background: var(--panel2); border-radius: 10px; padding: 10px 12px; }
.song .n { font-family: var(--display); font-size: 1.1rem; text-align: center; }
.song .t { min-width: 0; font-weight: 700; }
.song .s { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1.5px solid var(--red); white-space: nowrap; }
.song .s.open { border-color: var(--green); }
.sec-title { font-family: var(--display); letter-spacing: .08em; font-size: 1.1rem; margin: 0; }

.restart { justify-self: center; background: transparent; border: 0; color: var(--fg); font-weight: 700; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; text-decoration: underline; text-underline-offset: 4px; padding: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--green); color: var(--fg);
  font-family: var(--display); letter-spacing: .08em; font-size: 1.2rem; padding: 12px 20px; border-radius: 12px; transition: .3s; z-index: 30; pointer-events: none; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.preview-tag { text-align: center; font-size: .78rem; font-weight: 700; letter-spacing: .14em; color: var(--red); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.screen { width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 12px; overflow: hidden; background: #000; border: 2px solid var(--red-dim); }
.screen iframe, .screen > div { width: 100%; height: 100%; display: block; border: 0; }
.song button.pick { background: none; border: 0; padding: 0; text-align: left; font-weight: 700; color: var(--fg); text-decoration: underline; text-decoration-color: var(--red); text-underline-offset: 4px; }
.song.playing { outline: 2px solid var(--green); }
.tap-hint { font-size: .85rem; font-weight: 600; text-align: center; }
</style>
</head>
<body>

<!-- Welcome room -->
<section class="room" id="welcome">
  <div class="room-in">
    <div class="logo" id="logoW"></div>
    <h2>ARE YOU READY TO GO 99 DEEP?</h2>
    <p>Free to play. Listen, answer, unlock the music.</p>
    <button class="big-btn" id="enter" type="button">LET'S GO</button>
  </div>
</section>

<!-- How to play rooms -->
<section class="room" id="how" hidden>
  <div class="room-in">
    <div class="icon" id="howIcon"></div>
    <h2 id="howTitle"></h2>
    <p id="howText"></p>
    <div class="dots" id="howDots"></div>
    <button class="big-btn" id="howNext" type="button">NEXT</button>
  </div>
</section>

<main class="app" id="board" hidden>
  <div class="preview-tag">PITCH DEMO · PRIVATE</div>
  <div class="logo" id="logoB"></div>
  <h1 class="artist"><small>THE MUSIC GAME OF</small><span id="artistName"></span></h1>

  <div class="cab">
    <div class="meter" id="meter"></div>
    <div class="top-rank" id="topRank">99 DEEP</div>
    <div class="stats">
      <span>Questions <b id="qCount">0</b> / 99</span>
      <span class="juice">Juice <b id="juice">0</b></span>
    </div>

    <div class="deck">
      <button class="record" id="record" type="button" aria-label="Play"><span class="label"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></span></button>
      <div class="now-playing" id="nowPlaying">Tap the record to play</div>
      <div class="screen" id="screen" hidden><div id="yt"></div></div>
    </div>

    <div class="qcard" id="qcard">
      <div class="qhead"><span id="qLevel"></span><span id="qNum"></span></div>
      <div id="qBody"></div>
    </div>

    <button class="restart" id="restart" type="button">Restart game</button>
  </div>

  <h2 class="sec-title">THE SONGS</h2>
  <ul class="songs" id="songs"></ul>
</main>

<div class="toast" id="toast" role="status"></div>
<audio id="audio" preload="metadata" controlslist="nodownload noplaybackrate"></audio>

<script>
/* ============================================================
   ARTIST SETUP — this is the only part that changes per artist.
   name:  artist name
   songs: 5 to 10 songs. Song 1 is free. src = audio file path.
   questions: 99 slots. Fill each with { q, opts: [a, b, c], answer }
              (answer = number 0, 1 or 2). Empty slots show as "waiting".
   ============================================================ */
const ARTIST = {
  name: "NEMS",
  /* Pitch demo: each song plays inside the game from his official YouTube upload. */
  songs: [
    { title: "Bing Bong", id: "99Km36i5gJE", watch: "https://www.youtube.com/watch?v=99Km36i5gJE" },
    { title: "Where You Know Me From", id: "xTWp-aeE794", watch: "https://www.youtube.com/watch?v=xTWp-aeE794" },
    { title: "Don't Ever Disrespect Me", id: "5JMt_oOQZBs", watch: "https://www.youtube.com/watch?v=5JMt_oOQZBs" },
    { title: "Blicky", id: "A5uAk8gjAn8", watch: "https://www.youtube.com/watch?v=A5uAk8gjAn8" },
    { title: "Bing Bong (Remix)", id: "_3pF6_wqy7s", watch: "https://www.youtube.com/watch?v=_3pF6_wqy7s" }
  ],
  questions: (() => {
    /* Levels 1–3 filled for the pitch with checked facts. Levels 4–9 come from listening to the songs. */
    const filled = [
      { q: "What part of Brooklyn does NEMS come from?", opts: ["Bay Ridge", "Coney Island", "Brownsville"], answer: 1 },
      { q: "What catchphrase made NEMS blow up in 2021?", opts: ["Bing Bong", "Ding Dong", "Bada Bing"], answer: 0 },
      { q: "What was NEMS doing online when he first said \"Bing Bong\"?", opts: ["Battling another rapper", "Showing his merch", "Reviewing a pizza spot"], answer: 1 },
      { q: "Which one-minute street show helped \"Bing Bong\" go viral?", opts: ["Sidetalk", "Hot Ones", "Rap City"], answer: 0 },
      { q: "Which album is the original \"Bing Bong\" on?", opts: ["Gorilla Monsoon", "Bamboo", "Congo"], answer: 2 },
      { q: "Who jumps on the \"Bing Bong\" remix with NEMS?", opts: ["Fat Joe, Busta Rhymes & Styles P", "Jay-Z, Nas & Mobb Deep", "Method Man, Redman & Raekwon"], answer: 0 },
      { q: "Which band brought \"Bing Bong\" to the White House?", opts: ["Maroon 5", "The Jonas Brothers", "Coldplay"], answer: 1 },
      { q: "On which MTV2 battle league did NEMS set the record for most wins?", opts: ["Fight Klub", "Smack DVD", "Battle Zone"], answer: 0 },
      { q: "How many wins did NEMS rack up in Fight Klub?", opts: ["12", "18", "25"], answer: 2 },
      { q: "Which Bronx legend called NEMS \"the next\" version of himself?", opts: ["Big Pun", "Fat Joe", "KRS-One"], answer: 1 },
      { q: "What is NEMS's clothing brand called?", opts: ["FYL", "OGB", "BKX"], answer: 0 },
      { q: "Who is featured on \"Where You Know Me From\"?", opts: ["Westside Gunn", "Benny the Butcher", "Conway the Machine"], answer: 2 },
      { q: "Which album is \"Where You Know Me From\" on?", opts: ["Gorilla Monsoon", "Congo", "Coney Soprano"], answer: 0 },
      { q: "What year did Gorilla Monsoon come out?", opts: ["2016", "2019", "2021"], answer: 1 },
      { q: "Who produced all of Gorilla Monsoon?", opts: ["Jazzsoon", "Alchemist", "Statik Selektah"], answer: 0 },
      { q: "What Coney Island landmark is on the Gorilla Monsoon cover?", opts: ["The Cyclone", "The Wonder Wheel", "The Parachute Jump"], answer: 2 },
      { q: "Which Wu-Tang legend is on \"Don't Ever Disrespect Me\"?", opts: ["Raekwon", "Ghostface Killah", "Method Man"], answer: 1 },
      { q: "Which producer teamed up with NEMS on \"Don't Ever Disrespect Me\"?", opts: ["Scram Jones", "DJ Premier", "Pete Rock"], answer: 0 },
      { q: "Which album is \"Blicky\" from?", opts: ["Bamboo", "Rise of the Silverback", "America's Sweetheart"], answer: 1 },
      { q: "What year did Rise of the Silverback drop?", opts: ["2021", "2022", "2023"], answer: 2 },
      { q: "Whose voice opens Rise of the Silverback?", opts: ["Funkmaster Flex", "Angie Martinez", "Ebro"], answer: 1 },
      { q: "What was NEMS's debut album?", opts: ["Prezident's Day", "Super Marvelous", "Free Nems"], answer: 0 },
      { q: "What is NEMS's real name?", opts: ["Tony Davis", "Travis Doyle", "Terrence Dunn"], answer: 1 },
      { q: "Which Coney Island projects did NEMS grow up in?", opts: ["O'Dwyer Gardens", "Marlboro Houses", "Gravesend Houses"], answer: 0 },
      { q: "Which NYC battle competition did NEMS win?", opts: ["Grind Time", "Braggin' Rites", "King of the Dot"], answer: 1 },
      { q: "Which indie label did NEMS sign with after Fight Klub?", opts: ["Rawkus", "Duck Down", "Psycho+Logical Records"], answer: 2 },
      { q: "On which Ghostface Killah album does NEMS show up twice?", opts: ["36 Seasons", "Fishscale", "Supreme Clientele"], answer: 0 },
      { q: "Who trades bars with NEMS on \"200\"?", opts: ["Sean Price", "Spit Gemz", "Ill Bill"], answer: 1 },
      { q: "On Gorilla Monsoon, NEMS rhymes over whose classic beat?", opts: ["Biggie's \"Who Shot Ya?\"", "Nas's \"N.Y. State of Mind\"", "Mobb Deep's \"Shook Ones\""], answer: 0 },
      { q: "Which label put out Rise of the Silverback?", opts: ["Def Jam", "Goliath Records", "Rhymesayers"], answer: 1 },
      { q: "Who produced the original \"Bing Bong\"?", opts: ["Scram Jones", "Jazzsoon", "Vinny Idol"], answer: 2 },
      { q: "Which NBA team got its own \"Bing Bong\" remix?", opts: ["The Knicks", "The Nets", "The Celtics"], answer: 0 },
      { q: "What year was NEMS born?", opts: ["1979", "1982", "1986"], answer: 1 }
    ];
    return Array.from({ length: 99 }, (_, i) => filled[i] || null);
  })()
};

/* 9 levels x 11 questions = 99. Ranks are earned for each finished row of 3 levels. */
const LEVELS = 9, PER = 11, JUICE_EACH = 100;   // perfect run = 9,900 Juice
const RANKS = ["New Fan", "Real Fan", "Day One"];

/* Song 1 is free; the rest unlock evenly across the 9 levels, the last one at level 9. */
const unlockAt = ARTIST.songs.map((s, k) => k === 0 ? 0 : Math.round(k * LEVELS / (ARTIST.songs.length - 1)));

/* Graffiti-style 9 with a straight stem, no hook */
function nine() {
  const g = (c, d) => '<g transform="translate(' + d + ' ' + d + ')" fill="none" stroke="' + c + '" stroke-width="12" stroke-linecap="round"><ellipse cx="31" cy="29" rx="19" ry="21" transform="rotate(-8 31 29)"/><path d="M49 30 L42 86"/></g>';
  return '<svg class="nine" viewBox="-4 -4 72 100" aria-hidden="true">' + g("#000", 4) + g("#d62828", 0) + '</svg>';
}
const logoHTML = nine() + nine() + '<span class="deep">DEEP</span>';

const $ = id => document.getElementById(id);
const store = {
  get() { try { return JSON.parse(localStorage.getItem("deep99") || "{}"); } catch (e) { return {}; } },
  set(v) { try { localStorage.setItem("deep99", JSON.stringify(v)); } catch (e) {} }
};
let state = Object.assign({ done: 0, juice: 0, seenHow: false }, store.get());
const save = () => store.set(state);

const levelOf = n => Math.min(LEVELS, Math.floor(n / PER) + 1);       // level of question n (0-based)
const levelsDone = () => Math.floor(state.done / PER);
const isOpen = k => levelsDone() >= unlockAt[k];

function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2200); }

function renderMeter() {
  const m = $("meter"); m.innerHTML = "";
  const ld = levelsDone();
  for (let r = 0; r < 3; r++) {
    const row = document.createElement("div"); row.className = "row";
    let boxes = '<div class="boxes">';
    for (let c = 0; c < 3; c++) {
      const lv = r * 3 + c + 1;
      boxes += '<div class="lv' + (lv <= ld ? " done" : lv === ld + 1 && state.done < 99 ? " now" : "") + '">' + lv + '</div>';
    }
    row.innerHTML = boxes + '</div><div class="rank' + (ld >= (r + 1) * 3 ? " got" : "") + '">' + RANKS[r] + '</div>';
    m.append(row);
  }
  $("topRank").classList.toggle("got", state.done >= 99);
  $("qCount").textContent = state.done;
  $("juice").textContent = state.juice.toLocaleString();
}

function renderSongs() {
  const ul = $("songs"); ul.innerHTML = "";
  ARTIST.songs.forEach((s, k) => {
    const li = document.createElement("li"); li.className = "song";
    const open = isOpen(k);
    li.innerHTML = '<span class="n">' + (k + 1) + '</span><span class="t"></span><span class="s' + (open ? " open" : "") + '">' +
      (k === 0 ? "Free" : open ? "Unlocked" : "Level " + unlockAt[k]) + '</span>';
    const t = li.querySelector(".t");
    if (open) { const b = document.createElement("button"); b.type = "button"; b.className = "pick"; b.textContent = s.title; b.onclick = () => playSong(k); t.append(b); }
    else t.textContent = s.title;
    if (k === current) li.classList.add("playing");
    ul.append(li);
  });
}

function renderQuestion() {
  const body = $("qBody");
  if (state.done >= 99) {
    $("qLevel").textContent = "All levels cleared"; $("qNum").textContent = "99 / 99";
    body.innerHTML = '<div class="qtext">You went 99 DEEP. Every song is unlocked.</div>';
    return;
  }
  const n = state.done, lv = levelOf(n);
  $("qLevel").textContent = "Level " + lv; $("qNum").textContent = "Question " + (n + 1) + " of 99";
  const q = ARTIST.questions[n];
  if (!q) {
    body.innerHTML = '<div class="empty">Question slot ' + (n + 1) + ' is waiting for the artist\'s approval.</div>' +
      '<button class="next" id="skip" type="button">Preview next slot</button>';
    $("skip").onclick = () => advance(false);
    return;
  }
  body.innerHTML = '<div class="qtext"></div><div class="opts"></div>';
  body.querySelector(".qtext").textContent = q.q;
  const box = body.querySelector(".opts");
  q.opts.forEach((o, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "opt"; b.textContent = o;
    b.onclick = () => {
      if (i === q.answer) { b.classList.add("right"); setTimeout(() => advance(true), 600); }
      else { b.classList.add("wrong"); toast("Not quite. Listen again."); }
    };
    box.append(b);
  });
}

function advance(scored) {
  const before = levelsDone(), beforeRank = Math.floor(before / 3);
  state.done = Math.min(99, state.done + 1);
  if (scored) state.juice += JUICE_EACH;
  save();
  const after = levelsDone();
  if (after > before) {
    const newly = ARTIST.songs.findIndex((s, k) => unlockAt[k] > before && unlockAt[k] <= after);
    if (Math.floor(after / 3) > beforeRank) toast("PROMOTED: " + RANKS[Math.floor(after / 3) - 1].toUpperCase());
    else if (newly > -1) toast("SONG " + (newly + 1) + " UNLOCKED");
    else toast("LEVEL " + (before + 1) + " CLEARED");
  }
  if (state.done >= 99) toast("99 DEEP");
  renderAll();
}

/* Record: plays the newest unlocked song */
const audio = $("audio");
let current = -1, player = null, ytReady = false, pending = null;
const setIcon = on => { $("playIcon").innerHTML = on ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>'; $("record").classList.toggle("spin", on); };
window.onYouTubeIframeAPIReady = () => { ytReady = true; if (pending != null) { const k = pending; pending = null; playSong(k); } };
(function () { const t = document.createElement("script"); t.src = "https://www.youtube.com/iframe_api"; document.head.append(t); })();

function fallback(s) {
  const np = $("nowPlaying"); np.textContent = "";
  const a = document.createElement("a"); a.href = s.watch; a.target = "_blank"; a.rel = "noopener"; a.className = "yt";
  a.textContent = "This video only plays on YouTube. Tap to watch.";
  np.append(a);
}
function playSong(k) {
  const s = ARTIST.songs[k];
  if (!isOpen(k)) { toast("LOCKED UNTIL LEVEL " + unlockAt[k]); return; }
  current = k; renderSongs();
  $("nowPlaying").textContent = s.title;
  $("screen").hidden = false;
  if (!ytReady) { pending = k; return; }
  if (!player) {
    player = new YT.Player("yt", {
      videoId: s.id, playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
      events: {
        onReady: e => e.target.playVideo(),
        onStateChange: e => setIcon(e.data === YT.PlayerState.PLAYING),
        onError: () => { setIcon(false); fallback(ARTIST.songs[current]); }
      }
    });
  } else player.loadVideoById(s.id);
}
$("record").onclick = () => {
  if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) { player.pauseVideo(); return; }
  if (player && current > -1 && player.getPlayerState() === YT.PlayerState.PAUSED) { player.playVideo(); return; }
  let k = 0; ARTIST.songs.forEach((s, i) => { if (isOpen(i)) k = i; });
  playSong(current > -1 ? current : k);
};

/* How to play: one short instruction per room */
const HOW = [
  { i: "♪", t: "PRESS PLAY", x: "Tap the record to hear the music." },
  { i: "?", t: "ANSWER WHAT YOU HEARD", x: "Every question comes straight from the songs." },
  { i: "+", t: "UNLOCK THE MUSIC", x: "Clear levels to unlock new songs. Song 1 is free." },
  { i: "★", t: "CLIMB THE RANKS", x: "New Fan, Real Fan, Day One. Answer all 99 to go 99 DEEP." }
];
let howI = 0;
function showHow() {
  const h = HOW[howI];
  $("howIcon").textContent = h.i; $("howTitle").textContent = h.t; $("howText").textContent = h.x;
  $("howDots").innerHTML = HOW.map((_, i) => '<i class="' + (i === howI ? "on" : "") + '"></i>').join("");
  $("howNext").textContent = howI === HOW.length - 1 ? "START PLAYING" : "NEXT";
}
$("howNext").onclick = () => {
  if (howI < HOW.length - 1) { howI++; showHow(); return; }
  state.seenHow = true; save(); $("how").hidden = true; $("board").hidden = false;
};
$("enter").onclick = () => {
  $("welcome").hidden = true;
  if (state.seenHow) { $("board").hidden = false; return; }
  howI = 0; showHow(); $("how").hidden = false;
};
$("restart").onclick = () => {
  const b = $("restart");
  if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Tap again to erase and start over"; setTimeout(() => { delete b.dataset.sure; b.textContent = "Restart game"; }, 3000); return; }
  delete b.dataset.sure; b.textContent = "Restart game";
  audio.pause(); if (player && player.pauseVideo) player.pauseVideo(); state = { done: 0, juice: 0, seenHow: true }; save(); renderAll(); toast("NEW GAME");
};

function renderAll() { renderMeter(); renderQuestion(); renderSongs(); }
$("logoW").innerHTML = logoHTML; $("logoB").innerHTML = logoHTML;
$("artistName").textContent = ARTIST.name;
renderAll();
</script>
