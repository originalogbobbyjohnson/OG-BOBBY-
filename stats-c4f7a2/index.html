<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>OG Game Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700;800&display=swap">
<style>
:root { --bg: #123a99; --card: rgba(255,255,255,.08); --line: rgba(255,255,255,.18); --red: #d62828; --green: #2fbf57; }
* { box-sizing: border-box; }
html, body, section, .big div, .bar, .bar i { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
html { background: #123a99; }
body { margin: 0; min-height: 100vh; background: radial-gradient(120% 60% at 50% 0%, #2f6cf0 0%, #1a4fc9 45%, #123a99 100%) no-repeat, #123a99; color: #fff; font: 400 15px/1.4 "Barlow", system-ui, -apple-system, sans-serif; }
.wrap { max-width: 560px; margin: 0 auto; padding: 22px 16px 40px; display: grid; gap: 16px; }
#app { display: grid; gap: 14px; }
.top { text-align: center; display: grid; gap: 6px; }
.top img { width: 170px; height: auto; margin: 0 auto; display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
h1 { font: 400 1.5rem/1 "Anton", Impact, sans-serif; letter-spacing: .12em; margin: 0; }
.k { font: 800 .62rem/1 "Barlow", sans-serif; letter-spacing: .2em; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { all: unset; cursor: pointer; text-align: center; padding: 9px 4px; border-radius: 10px; border: 1px solid var(--line); font: 800 .66rem/1 "Barlow", sans-serif; letter-spacing: .12em; }
.seg button.on { background: #fff; color: #123a99; border-color: #fff; }
.big { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.big div { background: var(--card); border-radius: 12px; padding: 12px 4px; text-align: center; display: grid; gap: 6px; }
.big b { font: 400 1.7rem/1 "Anton", Impact, sans-serif; letter-spacing: .03em; }
.big i { font: 800 .55rem/1.15 "Barlow", sans-serif; font-style: normal; letter-spacing: .12em; }
section { background: var(--card); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
section h2 { margin: 0; font: 800 .7rem/1 "Barlow", sans-serif; letter-spacing: .2em; }
table { width: 100%; border-collapse: collapse; font-size: .86rem; }
th { text-align: right; font: 800 .55rem/1 "Barlow", sans-serif; letter-spacing: .12em; padding: 0 0 6px; }
th:first-child, td:first-child { text-align: left; }
td { text-align: right; padding: 7px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
td:first-child { padding-right: 8px; }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; margin-top: 5px; }
.bar i { display: block; height: 100%; background: var(--red); }
.q { display: grid; gap: 2px; padding: 8px 0; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; }
.q .s { font: 800 .55rem/1 "Barlow", sans-serif; letter-spacing: .12em; }
.q .t { font-size: .9rem; }
.q .p { font-size: .8rem; }
.list { display: grid; grid-template-columns: 1fr auto; gap: 7px 10px; font-size: .9rem; }
.list span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.key { display: grid; gap: 10px; }
.key input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.2); color: #fff; font: 600 .9rem "Barlow", sans-serif; }
.btn { all: unset; cursor: pointer; text-align: center; padding: 12px; border-radius: 12px; background: var(--red); font: 800 .8rem/1 "Barlow", sans-serif; letter-spacing: .14em; }
.btn.ghost { background: none; border: 1px solid #fff; }
.note { font-size: .82rem; }
.note a { color: #fff; }
.err { background: rgba(214,40,40,.25); border: 1px solid var(--red); border-radius: 10px; padding: 10px 12px; font-size: .85rem; }
.empty { font-size: .85rem; }
.gauge { display: grid; justify-items: center; gap: 2px; padding: 16px 14px 14px; }
.gauge svg { width: 100%; max-width: 300px; height: auto; display: block; }
.gauge .gn { font: 400 3.2rem/1 "Anton", Impact, sans-serif; margin-top: -78px; }
.gauge .gl { font: 800 .66rem/1 "Barlow", sans-serif; letter-spacing: .2em; margin-top: 6px; }
.gauge .gs { font-size: .88rem; margin-top: 8px; }
.gauge .ends { width: 100%; max-width: 300px; display: flex; justify-content: space-between; font: 800 .55rem/1 "Barlow", sans-serif; letter-spacing: .1em; margin-top: 4px; }
.ladder { display: grid; gap: 10px; }
.ladder .st { display: grid; gap: 5px; }
.ladder .row { display: flex; justify-content: space-between; font-size: .9rem; }
.ladder .row b { font-variant-numeric: tabular-nums; }
.ladder .bar i { background: #2fbf57; }
.ladder .st.top .bar i { background: linear-gradient(90deg, #ffe680, #f5c518 60%, #c98a00); }
.foot { text-align: center; font-size: .75rem; }
.foot button { all: unset; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="../brand/og-bobby-wordmark-top.png" alt="OG Bobby"><h1>GAME STATS</h1><div class="k">PRIVATE · ONLY YOU HAVE THIS LINK</div></div>
  <div id="app"></div>
</div>
<script>
const SONGS = [{"slug": "whatever-it-takes", "t": "Whatever It Takes", "q": ["What year does OG's story start?"]}, {"slug": "ridge-brothers", "t": "Ridge Brothers", "q": ["Who connected OG to the Jorgenson brothers?"]}, {"slug": "bay-ridge-nights", "t": "Bay Ridge Nights", "q": ["Which Bay Ridge spot was for the squares?"]}, {"slug": "the-get-back", "t": "The Get Back", "q": ["How old was OG's baby girl in '99?", "When did the brother say \"he don't sell\"?"]}, {"slug": "pioneer", "t": "Pioneer", "q": ["Where did the hustle start?", "What did the partner do with the shared money?"]}, {"slug": "bars-and-clubs", "t": "Bars & Clubs", "q": ["Which Bay Ridge bar gets named?", "Which Manhattan club gets a shout-out?"]}, {"slug": "bay-ridge-is-mine", "t": "Bay Ridge Is Mine", "q": ["What holiday was coming when it went down?", "How much money went missing?", "What's the hook?"]}, {"slug": "black-rob", "t": "Black Rob", "q": ["Which gym did Rob start in?", "What was Rob to OG in the boxing gym?", "Rob is like OG's..."]}, {"slug": "positivity-spreads", "t": "Positivity Spreads", "q": ["Which Brooklyn park does OG train in?", "What spreads?", "Who did OG earn his black belt under?"]}];
const NS = "ogbobbybrooklyn-c4f7a2";
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clean = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9_.-]+/g, "-").slice(0, 60);

async function one(k) {
  k = clean(k);
  try { const r = await fetch("https://abacus.jasoncameron.dev/get/" + NS + "/" + k, { cache: "no-store" }); if (r.status === 404) return { v: 0, ok: true }; if (r.ok) { const j = await r.json(); return { v: +j.value || 0, ok: true }; } } catch (e) {}
  try { const r = await fetch("https://api.counterapi.dev/v1/" + NS + "/" + k, { cache: "no-store" }); if (r.status === 404 || r.status === 400) return { v: 0, ok: true }; if (r.ok) { const j = await r.json(); return { v: +(j.count != null ? j.count : j.value) || 0, ok: true }; } } catch (e) {}
  return { v: 0, ok: false };
}

async function load() {
  app.innerHTML = '<p class="k" style="text-align:center">LOADING…</p>';
  const keys = ["players", "started", "rank-corner-kid", "rank-og-soldier", "rank-og-protege", "streaks", "lightning", "share-rank", "share-lightning", "remind-vol2", "trophy-case", "fun-runs", "restarts", "secret-store", "secret-moon", "secret-bridge", "secret-caddy"];
  SONGS.forEach(s => { keys.push("played-" + s.slug, "finished-" + s.slug); s.q.forEach((_, g) => keys.push("right-" + s.slug + "-q" + (g + 1), "wrong-" + s.slug + "-q" + (g + 1))); });
  const res = await Promise.all(keys.map(one));
  const c = {}; let reached = 0; keys.forEach((k, i) => { c[clean(k)] = res[i].v; if (res[i].ok) reached++; });
  if (!reached) { app.innerHTML = '<div class="err">Couldn\'t reach the counters right now. Check your connection and pull down to refresh.</div>'; return; }
  render(k => c[clean(k)] || 0);
}

function render(get) {
  const done = get("rank-og-protege"), soldier = get("rank-og-soldier"), corner = get("rank-corner-kid");
  const started = Math.max(get("started"), corner, soldier, done);
  const visitors = Math.max(get("players"), started);
  const played = SONGS.reduce((a, s) => a + get("played-" + s.slug), 0);
  const finished = SONGS.reduce((a, s) => a + get("finished-" + s.slug), 0);
  const pct = started ? done / started : 0;
  const A = f => { const a = Math.PI * (1 - f), r = 120; return [150 + r * Math.cos(a), 150 - r * Math.sin(a)]; };
  const [ex, ey] = A(Math.max(.0001, Math.min(1, pct)));
  let h = '<p class="k" style="text-align:center">ALL TIME · EACH PLAYER COUNTED ONCE</p>';
  h += '<section class="gauge"><h2>COMPLETED THE GAME</h2>' +
    '<svg viewBox="0 0 300 170" aria-hidden="true"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#ffe680"/><stop offset=".6" stop-color="#f5c518"/><stop offset="1" stop-color="#c98a00"/></linearGradient></defs>' +
    '<path d="M30 150 A120 120 0 0 1 270 150" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="22" stroke-linecap="round"/>' +
    (pct > 0 ? '<path d="M30 150 A120 120 0 0 1 ' + ex.toFixed(1) + ' ' + ey.toFixed(1) + '" fill="none" stroke="url(#gg)" stroke-width="22" stroke-linecap="round"/>' : '') +
    '</svg><div class="gn">' + done + '</div><div class="gl">PLAYERS FINISHED ALL 9</div>' +
    '<div class="gs">' + Math.round(pct * 100) + '% of the ' + started + ' who started</div>' +
    '<div class="ends"><span>0%</span><span>100%</span></div></section>';
  const steps = [["Started the game", started, ""], ["Corner Kid · songs 1–3", corner, ""], ["OG Soldier · songs 4–6", soldier, ""], ["OG Protégé · all 9 songs", done, " top"]];
  h += '<section><h2>HOW FAR PLAYERS GET</h2><div class="ladder">' + steps.map(([l, n, cl]) => '<div class="st' + cl + '"><div class="row"><span>' + l + '</span><b>' + n + (started ? ' · ' + Math.round(n / started * 100) + '%' : '') + '</b></div><div class="bar"><i style="width:' + (started ? Math.round(n / started * 100) : 0) + '%"></i></div></div>').join("") + '</div></section>';
  h += '<div class="big"><div><b>' + visitors + '</b><i>VISITORS</i></div><div><b>' + played + '</b><i>SONG<br>PLAYS</i></div><div><b>' + finished + '</b><i>SONGS<br>FINISHED</i></div><div><b>' + (corner + soldier + done) + '</b><i>RANK-UPS</i></div></div>';
  h += '<section><h2>EACH SONG</h2><table><tr><th>SONG</th><th>PLAYED</th><th>FINISHED</th><th>RATE</th></tr>' + SONGS.map((s, i) => {
    const p = get("played-" + s.slug), f = get("finished-" + s.slug);
    return '<tr><td>' + (i + 1) + '. ' + esc(s.t) + '</td><td>' + p + '</td><td>' + f + '</td><td>' + (p ? Math.min(100, Math.round(f / p * 100)) + "%" : "–") + '</td></tr>';
  }).join("") + '</table></section>';
  const qs = []; SONGS.forEach(s => s.q.forEach((t, g) => { const r = get("right-" + s.slug + "-q" + (g + 1)), w = get("wrong-" + s.slug + "-q" + (g + 1)); if (r + w) qs.push({ s: s.t, t, r, w, miss: w / (r + w) }); }));
  qs.sort((a, b) => b.miss - a.miss || (b.w - a.w));
  h += '<section><h2>HARDEST QUESTIONS · FIRST TRY</h2>' + (qs.length ? qs.slice(0, 8).map(q => '<div class="q"><span class="s">' + esc(q.s.toUpperCase()) + '</span><span class="t">' + esc(q.t) + '</span><span class="p">' + Math.round(q.miss * 100) + '% missed · ' + q.w + ' wrong, ' + q.r + ' right</span><div class="bar"><i style="width:' + Math.round(q.miss * 100) + '%"></i></div></div>').join("") : '<p class="empty">No answers yet.</p>') + '</section>';
  const secrets = ["store", "moon", "bridge", "caddy"].reduce((a, k) => a + get("secret-" + k), 0);
  const X = [["Lightning rounds played", get("lightning")], ["Hot streaks (3 in a row)", get("streaks")], ["Ranks shared", get("share-rank")], ["Lightning scores shared", get("share-lightning")], ["Vol. 2 reminders added", get("remind-vol2")], ["Secret spots found", secrets], ["Opened the trophy case", get("trophy-case")], ["Fun runs", get("fun-runs")], ["Game restarts", get("restarts")]];
  h += '<section><h2>EXTRAS</h2><div class="list">' + X.map(([l, n]) => '<span>' + l + '</span><span>' + n + '</span>').join("") + '</div></section>';
  h += '<p class="foot">Counting started October 17, 2026. <button id="re">Refresh</button></p>';
  app.innerHTML = h;
  $("#re").onclick = load;
}
load();
</script>
</body>
</html>
