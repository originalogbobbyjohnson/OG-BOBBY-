<style>
:root {
  --bg: #0f1a12; --panel: #17251a; --line: #2a4231;
  --fg: #eef3ea; --muted: #9db3a2; --gold: #e3b23c;
  --display: "Anton", Impact, "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 16px; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 540px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 18px; }
header > img { width: 100%; height: auto; aspect-ratio: 1376 / 768; object-fit: cover; border-radius: 14px; display: block; border: 2px solid #8a6d24; }
.vip-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
.vip-row > div { min-width: 0; }
h1 { margin: 0; line-height: 0; }
h1 img { display: block; width: min(100%, 300px); height: auto; filter: drop-shadow(3px 3px 0 #000); }
.vip-tag { display: block; margin-top: 6px; font-family: "Sedgwick Ave Display", "Permanent Marker", cursive; font-size: 1.6rem; line-height: 1; color: var(--gold); text-shadow: 2px 2px 0 #000; }
.og-badge { flex: none; display: grid; justify-items: center; gap: 4px; }
.og-badge img { width: 64px; height: 64px; border-radius: 14px; box-shadow: 0 0 18px 4px rgba(227,178,60,.6); }
.og-badge span { font-size: .6rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.og-badge .nine-badge { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 14px; background: #000; border: 2px solid #e3b23c; box-shadow: 0 0 18px 4px rgba(227,178,60,.6); }
.nine-badge svg { width: 26px; height: auto; overflow: visible; }
.og-badge .nine-badge { display: flex; align-items: flex-start; justify-content: center; padding-top: 12px; gap: 1px; }
.og-badge .nine-badge .tick { letter-spacing: 0; font-weight: 400; font-family: var(--display); font-size: 1.6rem; line-height: .8; color: #fff; text-shadow: 2px 2px 0 #000; }
.sub { color: var(--muted); margin-top: 6px; font-size: .95rem; }
.now { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
.lab { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
#nowTitle { font-family: var(--display); font-weight: 400; font-size: 1.8rem; line-height: 1.05; }
input[type=range] { width: 100%; accent-color: var(--gold); }
.times { display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.controls { display: flex; justify-content: center; align-items: center; gap: 20px; }
.controls button { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 50%; width: 56px; height: 56px; display: grid; place-items: center; cursor: pointer; }
.controls button.play { width: 72px; height: 72px; background: var(--gold); border-color: var(--gold); color: var(--bg); }
.controls svg { width: 24px; height: 24px; fill: currentColor; }
.controls button.play svg { width: 30px; height: 30px; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
ol { list-style: none; margin: 0; padding: 0; display: grid; }
li button { width: 100%; display: grid; grid-template-columns: 2rem 1fr auto; gap: 10px; align-items: center; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--fg); font: inherit; padding: 13px 4px; cursor: pointer; }
li button[aria-current="true"] { color: var(--gold); }
li .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .85rem; }
li button[aria-current="true"] .n { color: var(--gold); }
li .t { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
li .d { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
footer { color: var(--muted); font-size: .8rem; text-align: center; }

<body>
<div class="wrap">
  <header>
    <img src="../cover.jpg" alt="OG Bobby artwork" width="1376" height="768">
    <div class="vip-row">
      <div>
        <h1><img src="../brand/og-bobby-wordmark.png" alt="OG Bobby" width="932" height="220"></h1>
        <span class="vip-tag">OG CERTIFIED</span>
      </div>
      <div class="og-badge" aria-hidden="true"><span class="nine-badge"><span class="tick">’</span><svg viewBox="-4 -4 72 100" aria-hidden="true"><g transform="translate(4 4)" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="31" cy="29" rx="19" ry="21" transform="rotate(-8 31 29)"/><path d="M49 30 L42 86"/></g><g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="31" cy="29" rx="19" ry="21" transform="rotate(-8 31 29)"/><path d="M49 30 L42 86"/></g></svg></span><span>Certified</span></div>
    </div>
    <div class="sub">Your OG Certified playlist · 32:56</div>
  </header>
  <section class="now">
    <div class="lab">Now playing</div>
    <div id="nowTitle">Whatever It Takes</div>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
    <div class="times"><span id="cur">0:00</span><span id="tot">0:00</span></div>
    <div class="controls">
      <button id="prev" aria-label="Previous song"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="play" id="play" aria-label="Play"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="next" aria-label="Next song"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
  </section>
  <ol id="list"></ol>
  <footer><a href="../" style="color:var(--gold)">Back to OG Bobby</a><br>© OG Bobby · Bay Ridge, Brooklyn</footer>
</div>
<audio id="audio" preload="metadata"></audio>
<script>
const CFG = {"mode": "tracks", "mix": "133ed2d14295.mp3", "tracks": [{"t": "Whatever It Takes", "f": "d3ab12f57f9a.mp3", "d": 160.03, "s": 0}, {"t": "Ridge Brothers", "f": "a1fe8390ba3c.mp3", "d": 224.42, "s": 155.03}, {"t": "Bay Ridge Nights", "f": "852a39797d0e.mp3", "d": 203.96, "s": 374.45}, {"t": "The Get Back (Raw Cut)", "f": "25ecbcfe1e48.mp3", "d": 210.02, "s": 573.41}, {"t": "Pioneer", "f": "94b1e9bbeb9e.mp3", "d": 207.65, "s": 778.43}, {"t": "Bars & Clubs", "f": "6abe6700735e.mp3", "d": 179.44, "s": 981.08}, {"t": "Bay Ridge Is Mine", "f": "e9f4ac8096a8.mp3", "d": 280.79, "s": 1155.52}, {"t": "Black Rob", "f": "814f5a9e2c7b.mp3", "d": 215.47, "s": 1431.31}, {"t": "Positivity Spreads", "f": "85cfe59cf72c.mp3", "d": 286.8, "s": 1641.78}]};
const PICK = (location.hash.slice(1).match(/\d+/g) || []).map(Number).filter(n => n >= 1 && n <= CFG.tracks.length);
const T = PICK.length ? CFG.tracks.filter((_, i) => PICK.includes(i + 1)) : [], FADE = CFG.mode === "fade";
const audio = document.getElementById("audio");
const $ = id => document.getElementById(id);
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
let cur = 0, seeking = false;

T.forEach((t, i) => {
  const li = document.createElement("li"), b = document.createElement("button");
  b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="t"></span><span class="d">' + fmt(t.d) + '</span>';
  b.querySelector(".t").textContent = t.t;
  b.onclick = () => go(i, true);
  li.appendChild(b); $("list").appendChild(li);
});
const btns = [...document.querySelectorAll("li button")];

function mark(i) {
  if (i === cur && btns[i].getAttribute("aria-current")) return;
  cur = i;
  btns.forEach(b => b.removeAttribute("aria-current"));
  btns[i].setAttribute("aria-current", "true");
  $("nowTitle").textContent = T[i].t;
  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: T[i].t, artist: "OG Bobby", album: "OG Made",
        artwork: [{ src: new URL("../cover.png", location.href).href, sizes: "512x512", type: "image/png" }] });
    } catch (e) {}
  }
}

function go(i, play) {
  if (i < 0 || i >= T.length) return;
  if (FADE) {
    if (!audio.src) audio.src = "../m/" + CFG.mix;
    const seekTo = () => { audio.currentTime = T[i].s; };
    if (audio.readyState >= 1) seekTo(); else audio.addEventListener("loadedmetadata", seekTo, { once: true });
  } else {
    audio.src = "../m/" + T[i].f;
  }
  mark(i);
  if (play) audio.play().catch(() => {});
}

function idxAt(t) { let i = 0; for (let k = 0; k < T.length; k++) if (t >= T[k].s) i = k; return i; }

audio.addEventListener("timeupdate", () => {
  if (FADE) {
    const i = idxAt(audio.currentTime + 0.5);
    if (i !== cur) mark(i);
    if (!seeking) {
      const d = audio.duration || 1;
      $("seek").value = audio.currentTime / d * 1000;
      $("cur").textContent = fmt(audio.currentTime); $("tot").textContent = fmt(audio.duration);
    }
  } else if (!seeking) {
    const d = audio.duration || T[cur].d;
    $("seek").value = audio.currentTime / d * 1000;
    $("cur").textContent = fmt(audio.currentTime); $("tot").textContent = fmt(d);
  }
});
audio.addEventListener("ended", () => { if (!FADE && cur + 1 < T.length) go(cur + 1, true); setIcon(); });
const setIcon = () => {
  $("playIcon").innerHTML = audio.paused ? '<path d="M8 5v14l11-7z"/>' : '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  $("play").setAttribute("aria-label", audio.paused ? "Play" : "Pause");
};
audio.addEventListener("play", setIcon); audio.addEventListener("pause", setIcon);

$("play").onclick = () => { if (!audio.src) go(0, true); else audio.paused ? audio.play() : audio.pause(); };
$("next").onclick = () => go(Math.min(cur + 1, T.length - 1), true);
$("prev").onclick = () => {
  const into = FADE ? audio.currentTime - T[cur].s : audio.currentTime;
  go(into > 3 || cur === 0 ? cur : cur - 1, true);
};
$("seek").addEventListener("input", () => { seeking = true; const d = audio.duration || 0; $("cur").textContent = fmt($("seek").value / 1000 * d); });
$("seek").addEventListener("change", () => { const d = audio.duration || 0; audio.currentTime = $("seek").value / 1000 * d; seeking = false; });

if ("mediaSession" in navigator) {
  try {
    navigator.mediaSession.setActionHandler("nexttrack", () => $("next").onclick());
    navigator.mediaSession.setActionHandler("previoustrack", () => $("prev").onclick());
    navigator.mediaSession.setActionHandler("play", () => audio.play());
    navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  } catch (e) {}
}
if (!T.length) { document.getElementById("nowTitle").textContent = "Earn songs on the OG Bobby page"; document.querySelector(".controls").hidden = true; } else mark(0);
if (T.length) $("tot").textContent = fmt(FADE ? 1928.4 : T[0].d);
addEventListener("hashchange", () => location.reload());
</script>
</body>
