<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OG Made '99 Header</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark only">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&family=Sedgwick+Ave+Display&display=swap">
<link rel="stylesheet" href="../og-made-header.css">
<style>
/* Private page: the OG MADE '99 header, signed OG BOBBY, ready to save as a picture for Reels and posts. */
:root { --bg: #0d0f14; --line: #343b4b; --red: #d63a2f; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: #fff; font: 600 1rem/1.4 "Barlow", system-ui, sans-serif; padding: max(20px, env(safe-area-inset-top)) 16px 40px; display: grid; gap: 18px; justify-items: center; }
h1 { margin: 0; font: 700 .8rem/1 "Barlow", system-ui, sans-serif; letter-spacing: .24em; text-transform: uppercase; }
.card { width: min(100%, 460px); border: 2px solid var(--line); border-radius: 18px; padding: 26px 12px; display: grid; place-items: center; }
.card.checker { background: repeating-conic-gradient(#2a2e38 0 25%, #1c1f27 0 50%) 0 0 / 22px 22px; }
.card.night { background: linear-gradient(#0b1430, #2a2440); }
.lab { font: 700 .72rem/1 "Barlow", system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #fff; margin-bottom: 8px; text-align: center; }
.btns { display: grid; gap: 10px; width: min(100%, 460px); }
button { appearance: none; border: 0; border-radius: 14px; padding: 16px; background: var(--red); color: #fff; font: 700 1rem/1 "Barlow", system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
button.alt { background: transparent; border: 2px solid #fff; }
.note { width: min(100%, 460px); text-align: center; font-size: .9rem; color: #fff; }
.note[hidden] { display: none; }
</style>
</head>
<body>
<h1>OG Made ’99 · Header</h1>
<div>
  <div class="lab">See-through background (goes on top of any video)</div>
  <div class="card checker"><div class="omh" role="img" aria-label="OG Made ’99, signed OG Bobby"><div class="omh-row"><span class="omh-word">OG MADE</span><img class="omh-99" src="../og-made-99.svg" alt=""></div><div class="omh-sig">— <img src="../og-bobby-wordmark-top.png" alt=""></div></div></div>
</div>
<div>
  <div class="lab">On the Bay Ridge night sky</div>
  <div class="card night"><div class="omh" role="img" aria-label="OG Made ’99, signed OG Bobby"><div class="omh-row"><span class="omh-word">OG MADE</span><img class="omh-99" src="../og-made-99.svg" alt=""></div><div class="omh-sig">— <img src="../og-bobby-wordmark-top.png" alt=""></div></div></div>
</div>
<div class="btns">
  <button id="saveClear" type="button">Save picture · see-through</button>
  <button id="saveNight" class="alt" type="button">Save picture · night sky</button>
</div>
<p class="note" id="msg" hidden></p>
<script>
/* Draws the header big on a canvas (same lettering, same neon '99, same signature) and hands it to the phone to save. */
(function () {
  const W = 1800, H = 760;
  const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  async function draw(night) {
    await document.fonts.load('400 200px "Sedgwick Ave Display"');
    const [n99, sig] = await Promise.all([load("../og-made-99.svg"), load("../og-bobby-wordmark-top.png")]);
    const c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
    if (night) { const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#0b1430"); g.addColorStop(1, "#2a2440"); x.fillStyle = g; x.fillRect(0, 0, W, H); }
    const fs = 250; x.font = '400 ' + fs + 'px "Sedgwick Ave Display", cursive'; x.textBaseline = "alphabetic";
    const word = "OG MADE", tw = x.measureText(word).width, nw = fs * 2.1, nh = nw * 288 / 448, gap = fs * .2;
    const total = tw + gap + nw, left = (W - total) / 2, base = 400;
    x.save(); x.shadowColor = "rgba(0,0,0,.65)"; x.shadowBlur = 40; x.shadowOffsetY = 26;
    x.fillStyle = "#000"; x.fillText(word, left + fs * .04, base + fs * .06); x.restore();
    x.fillStyle = "#fff"; x.fillText(word, left, base);
    x.save(); x.shadowColor = "rgba(0,0,0,.6)"; x.shadowBlur = 24; x.shadowOffsetY = 16;
    x.drawImage(n99, left + tw + gap - fs * .15, base - fs * .35 - nh * .62, nw, nh); x.restore();
    // signature: a dash and the OG BOBBY wordmark, right side, underneath
    const sw = fs * 6.2 * .32, sh = sw * 340 / 1052, right = left + total - fs * .1, sy = base + 40;
    x.save(); x.shadowColor = "rgba(0,0,0,.7)"; x.shadowBlur = 12; x.shadowOffsetY = 6;
    x.drawImage(sig, right - sw, sy, sw, sh);
    x.fillStyle = "#fff"; x.font = '700 ' + Math.round(fs * .32) + 'px "Barlow", system-ui, sans-serif';
    const dw = x.measureText("—").width; x.fillText("—", right - sw - dw - 14, sy + sh * .66); x.restore();
    return new Promise(res => c.toBlob(res, "image/png"));
  }
  const msg = document.getElementById("msg");
  async function save(night) {
    msg.hidden = false; msg.textContent = "Making the picture…";
    try {
      const blob = await draw(night), name = night ? "og-made-99-header-night.png" : "og-made-99-header.png";
      const file = new File([blob], name, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); msg.textContent = "Pick “Save Image” to put it in your Photos."; return; }
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove();
      msg.textContent = "Saved.";
    } catch (e) { msg.textContent = "That didn't go through. Tap the button again."; }
  }
  document.getElementById("saveClear").onclick = () => save(false);
  document.getElementById("saveNight").onclick = () => save(true);
})();
</script>
</body>
</html>
