<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@600;700&display=swap">
<style>
@font-face { font-family: "Sedgwick Nine"; src: url("../brand/sedgwick-nine.woff") format("woff"); unicode-range: U+0039; }
html,body{margin:0;background:#000;overflow:hidden}
.box{position:fixed;left:0;top:0;overflow:hidden;background:#000}
.box img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35),rgba(0,0,0,0) 25%,rgba(0,0,0,0) 62%,rgba(0,0,0,.85))}
.wm{position:absolute;height:auto;filter:drop-shadow(3px 3px 0 #000)}
.bar{position:absolute;left:0;right:0;bottom:0;background:#d62828;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 -8px 24px rgba(0,0,0,.6)}
.bar .t{font:400 1em/1 Anton,Impact,sans-serif;letter-spacing:.04em;color:#fff;text-shadow:.03em .03em 0 #000}
.bar .s{font:700 .22em/1.2 "Sedgwick Nine",Barlow,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#fff;margin-top:.12em}
/* square: 880 */
.sq{width:880px;height:880px}.sq .wm{top:44px;left:44px;width:300px}.sq .bar{height:194px;font-size:106px}
/* share: 1200x630 at 0.7 = 840x441 */
.sh{width:840px;height:441px}.sh img.bg{object-position:50% 22%}.sh .wm{top:26px;left:30px;width:190px}.sh .bar{height:110px;font-size:62px}
</style></head><body>
<div class="box" id="b"><img class="bg" src="b.jpg"><div class="shade"></div><img class="wm" src="../brand/og-bobby-wordmark.png"><div class="bar"><div class="t">OG CERTIFIED</div><div class="s">The Complete Series · 19 Episodes</div></div></div>
<script>document.getElementById("b").className="box "+(location.hash==="#share"?"sh":"sq");</script>
</body></html>
